<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.tick{right:22px;top:20px;padding:10px 14px;font-size:14px;display:grid;grid-template-columns:auto auto;gap:5px 14px;letter-spacing:.5px}
.tick .u{color:#3dff8f;text-shadow:0 0 8px rgba(61,255,143,.6)} .tick .d{color:#ff5161}
.shade{background:linear-gradient(90deg,rgba(1,4,3,.93) 0%,rgba(1,4,3,.72) 30%,rgba(1,4,3,.15) 52%,rgba(0,0,0,0) 62%),
  linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0) 30%)}
</style></head>
<body><div id="stage"><div class="shade"></div>
<div class="txt">
  <svg class="crown" viewBox="0 0 120 80"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3c0"/><stop offset=".45" stop-color="#f3bf45"/><stop offset=".7" stop-color="#a56d12"/><stop offset="1" stop-color="#f7d070"/></linearGradient></defs>
    <path d="M10 66 L4 18 L32 40 L60 6 L88 40 L116 18 L110 66 Z" fill="url(#cg)" stroke="#5c3a07" stroke-width="2"/>
    <rect x="9" y="64" width="102" height="12" rx="3" fill="url(#cg)" stroke="#5c3a07" stroke-width="2"/>
    <circle cx="4" cy="16" r="5" fill="url(#cg)"/><circle cx="60" cy="5" r="5" fill="url(#cg)"/><circle cx="116" cy="16" r="5" fill="url(#cg)"/>
    <circle cx="60" cy="48" r="7" fill="#12b85a" stroke="#ffe08a" stroke-width="2"/><circle cx="33" cy="54" r="4.5" fill="#d4142c" stroke="#ffe08a" stroke-width="1.5"/>
    <circle cx="87" cy="54" r="4.5" fill="#d4142c" stroke="#ffe08a" stroke-width="1.5"/></svg>
  <div class="t1">EMPIRE</div>
  <div class="rule"><i></i><b></b><i></i></div>
  <div class="t2">BIRJA</div>
  <div class="t3">SAVDO<span>◆</span>TAHLIL<span>◆</span>DAROMAD</div>
</div>
</div>
<script src="three.min.js"></script><script src="common.js"></script><script>
(async () => {
const {R, S} = setup((g, w, h) => {
  const l = g.createLinearGradient(0, 0, 0, h);
  l.addColorStop(0, '#010605'); l.addColorStop(.55, '#032018'); l.addColorStop(1, '#010302');
  g.fillStyle = l; g.fillRect(0, 0, w, h);
  const gl = g.createRadialGradient(w * .74, h * .42, 0, w * .74, h * .42, w * .45);
  gl.addColorStop(0, 'rgba(40,255,150,.28)'); gl.addColorStop(.5, 'rgba(10,120,80,.12)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gl; g.fillRect(0, 0, w, h);
  // to'r chiziqlari
  g.strokeStyle = 'rgba(80,255,170,.07)'; g.lineWidth = 2;
  for (let x = 0; x < w; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = 0; y < h; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  // xira fondagi grafik chizig'i
  g.strokeStyle = 'rgba(60,255,150,.22)'; g.lineWidth = 4; g.beginPath();
  let y = h * .7; for (let x = w * .3; x < w; x += 24) { y += (Math.random() - .62) * 40; y = Math.max(h * .15, Math.min(h * .8, y)); x === w * .3 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
}, [[0, '#e9fff4'], [.25, '#e2b04a'], [.5, '#0d3a2a'], [1, '#010302']]);
const face = await loadTex('emp_face.webp');
const cam = new THREE.PerspectiveCamera(30, W / H, .1, 100); cam.position.set(0, 1.9, 13); cam.lookAt(0, 1.45, 0);

S.add(new THREE.HemisphereLight(0xc8ffe8, 0x02100a, .35));
const key = new THREE.DirectionalLight(0xfff0d0, 1.5); key.position.set(-3, 7, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, {left: -8, right: 8, top: 6, bottom: -4}); S.add(key);
const rim = new THREE.DirectionalLight(0x40ffa0, 1.8); rim.position.set(6, 3, -6); S.add(rim);
const warm = new THREE.PointLight(0xffc060, 1.8, 14); warm.position.set(4, 2, 4); S.add(warm);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshPhysicalMaterial({color: 0x020504, roughness: .18, metalness: .1, clearcoat: 1, clearcoatRoughness: .06, envMapIntensity: .2}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; S.add(floor);

// ── 3D shamlar (candlestick) — o'sish tendensiyasi ──
const GRN = new THREE.MeshStandardMaterial({color: 0x00a844, emissive: 0x00e060, emissiveIntensity: .75, roughness: .55, metalness: 0, envMapIntensity: 0, toneMapped: false});
const RED = new THREE.MeshStandardMaterial({color: 0xb0101e, emissive: 0xe8182c, emissiveIntensity: .75, roughness: .55, metalness: 0, envMapIntensity: 0, toneMapped: false});
let rnd = 11; const r2 = () => (rnd = (rnd * 9301 + 49297) % 233280) / 233280;
let price = .6; const xs = [];
for (let i = 0; i < 16; i++) {
  const x = -.4 + i * .36, open = price, up = r2() > .32, d = (.08 + r2() * .22) * (up ? 1 : -.8);
  price = Math.max(.35, open + d + .04); const close = price;
  const lo = Math.min(open, close), hi = Math.max(open, close), mat = close >= open ? GRN : RED;
  const body = new THREE.Mesh(new THREE.BoxGeometry(.26, Math.max(.06, hi - lo), .26), mat); body.position.set(x, (lo + hi) / 2, -.6); body.castShadow = true; S.add(body);
  const wk = new THREE.Mesh(new THREE.BoxGeometry(.04, hi - lo + .3 + r2() * .3, .04), mat); wk.position.set(x, (lo + hi) / 2, -.6); S.add(wk);
  xs.push([x, hi]);
}
// fondagi xira shamlar qatori
for (let i = 0; i < 22; i++) { const h = .4 + i * .09 + Math.random() * .3, m = Math.random() > .3 ? GRN : RED;
  const b = new THREE.Mesh(new THREE.BoxGeometry(.3, h, .3), m.clone()); b.material.emissiveIntensity = .3; b.material.transparent = true; b.material.opacity = .35;
  b.position.set(-1 + i * .45, h / 2 + .2, -4.5); S.add(b); }

// ── oltin o'sish strelkasi ──
const pts = [[-0.6, .45], [.8, 1.0], [1.5, .78], [2.6, 1.6], [3.2, 1.4], [4.4, 2.55]].map(([x, y]) => new THREE.Vector3(x, y + .35, .4));
const path = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', .05);
const arrowMat = new THREE.MeshPhysicalMaterial({color: 0xffc23a, metalness: 1, roughness: .18, emissive: 0x8a5200, emissiveIntensity: .55, clearcoat: .6});
const tube = new THREE.Mesh(new THREE.TubeGeometry(path, 200, .1, 20, false), arrowMat); tube.castShadow = true; S.add(tube);
const glowT = new THREE.Mesh(new THREE.TubeGeometry(path, 200, .22, 16, false), new THREE.MeshBasicMaterial({color: 0xffb020, transparent: true, opacity: .16})); S.add(glowT);
const end = pts[pts.length - 1], dir = end.clone().sub(pts[pts.length - 2]).normalize();
const head = new THREE.Mesh(new THREE.ConeGeometry(.32, .7, 32), arrowMat); head.position.copy(end).addScaledVector(dir, .25);
head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); head.castShadow = true; S.add(head);
const hl = new THREE.PointLight(0xffc040, 2.2, 5); hl.position.copy(end).add(new THREE.Vector3(0, .3, .8)); S.add(hl);

// EMP tangalar + oltin quymalar
for (const [x, z, n] of [[4.9, 2.4, 9], [5.7, 1.5, 13], [2.6, 3.2, 3]]) { const st = coinStack(face, n); st.position.set(x, 0, z); S.add(st); }
const big = coin(face, .8, .14); big.rotation.order = 'YXZ'; big.rotation.set(Math.PI / 2 - .25, -.45, .1); big.position.set(3.55, .9, 3.7); S.add(big);
[[0, 0], [.95, 0], [.48, .24]].forEach(([x, y]) => { const b = goldBar(); b.position.set(5.2 + x, y + .12, 3.4); b.rotation.y = -.3; S.add(b); });

done(R, S, cam);
})();
</script></body></html>
